name: CI

# Copied from Gradelings and cut to size. Everything runs in parallel; "CI passed" is the one check to
# require in branch protection, and it is green only when every other job is (a skipped job counts as passed).
#
# Speed (2026-11-09, 2026-11-10): the "changes" job skips everything for a tree that already passed and for
# Markdown-only changes, and skips the native builds unless native code, Capacitor or dependencies changed; the device sweep is split by
# platform; Gradle uses its build cache; the iOS build compiles for one simulator architecture and doesn't wait
# for the web build.

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # What this run has to do (Melvin asked, 2026-11-10: "find other ways to reduce CI runs"). Three answers:
  #  1. Nothing, when this exact tree already passed. "CI passed" records the tree it tested as a commit status
  #     ("CI passed tree") on the commit it ran for, so the staging push after a squash merge (when staging didn't
  #     move meanwhile), the nightly promotion pull request, the push to main and the merge back into staging are
  #     all recognised as already tested and finish in seconds.
  #  2. Only the gate, when every changed file is Markdown (docs, AGENTS.md, READMEs) and the commit before it passed.
  #     docs/PLAY_LISTING.md is the exception: a unit test checks it. Locale text (src/locales/) is not "copy" here:
  #     it is app code, the tests check every key in every language, and longer text can break layouts.
  #  3. The web jobs, plus both native builds when native code, Capacitor or dependencies changed.
  # On a pull request the checkout is GitHub's merge commit: HEAD^1 is the base branch tip and HEAD^2 the pull
  # request's head. On a push the diff is against the branch's previous tip.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      web: ${{ steps.diff.outputs.web }}
      native: ${{ steps.diff.outputs.native }}
      tree: ${{ steps.diff.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          everything() { echo "web=true" >> "$GITHUB_OUTPUT"; echo "native=true" >> "$GITHUB_OUTPUT"; exit 0; }
          # passed <commit> <tree>: did "CI passed" succeed on that commit, testing that tree?
          passed() {
            [ -n "$1" ] || return 1
            desc=$(gh api "repos/$REPO/commits/$1/statuses?per_page=100" \
              --jq '[.[] | select(.context == "CI passed tree")][0] | select(.state == "success") | .description' 2>/dev/null || true)
            [ "$desc" = "Passed on tree $2" ]
          }

          # 1. This tree already passed: on this commit (a re-run), a parent (a merge whose result equals one side), or
          #    the pull request a squash commit came from.
          candidates="$(git rev-parse HEAD^@ 2>/dev/null || true)"
          if [ "$EVENT" = push ]; then
            candidates="$GITHUB_SHA $candidates $(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq '.[].head.sha' 2>/dev/null || true)"
          fi
          for c in $candidates; do
            if passed "$c" "$tree"; then
              echo "web=false" >> "$GITHUB_OUTPUT"; echo "native=false" >> "$GITHUB_OUTPUT"
              echo "::notice::This exact tree already passed CI on ${c:0:7}, so nothing runs again."
              exit 0
            fi
          done

          # 2 and 3. What changed since the base.
          if [ "$EVENT" = pull_request ]; then
            base=$(git rev-parse HEAD^1)
          else
            base=$BEFORE
            case "$base" in ""|0000000000000000000000000000000000000000) everything ;; esac
            git fetch --no-tags --depth=1 origin "$base" || everything
          fi
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          [ -n "$files" ] || everything

          # Here-strings rather than pipes: with pipefail, a pipe into grep -q can fail on SIGPIPE.
          not_md=$(grep -vE '\.md$' <<< "$files" || true)
          if [ -z "$not_md" ] && ! grep -qx 'docs/PLAY_LISTING.md' <<< "$files" \
            && passed "$base" "$(git rev-parse "$base^{tree}")"; then
            echo "web=false" >> "$GITHUB_OUTPUT"; echo "native=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Only Markdown changed and ${base:0:7} passed CI, so the tests and builds are skipped."
            exit 0
          fi
          echo "web=true" >> "$GITHUB_OUTPUT"

          # Anything that can change what the Android or iOS compiler sees: the native projects, Capacitor's config,
          # the npm packages (Capacitor plugins carry native code), and CI itself.
          if grep -qE '^(android/|ios/|capacitor\.config\.|package(-lock)?\.json$|\.github/(workflows/ci\.yml|actions/))' <<< "$files"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No native, Capacitor or dependency changes, so the Android and iOS builds are skipped."
          fi

  static:
    name: Types, lint and audit
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Types
        run: npx tsc --noEmit
      - name: Engine types (unchecked index access)
        if: ${{ !cancelled() }}
        run: npm run typecheck:engine
      - name: Lint
        if: ${{ !cancelled() }}
        run: npx eslint --max-warnings 0
      - name: Formatting
        if: ${{ !cancelled() }}
        run: npx prettier --check .
      # Production dependencies ship to users, so they gate the build; dev tooling is reported only.
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high
      - if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
        continue-on-error: true

  unit:
    name: Unit and integration tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx vitest run --coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node -e "const s=require('./coverage/coverage-summary.json').total;const r=['lines','statements','functions','branches'].map(k=>'| '+k+' | '+s[k].pct+'% |').join('\n');require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### Unit test coverage\n\n| | |\n|---|---|\n'+r+'\n')"

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build:static
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: out
          retention-days: 3

  browser:
    name: Browser · ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          # The playthrough on Pixel 7 (Chromium) and again on an iPhone in WebKit, the engine behind the iOS app.
          - { name: "playthrough and offline", run: "node scripts/e2e.mjs '' e2e-shots && node scripts/e2e-offline.mjs && DEVICE='iPhone 16' node scripts/e2e.mjs '' e2e-shots/iphone" }
          # Layout sweep on the phones and tablets in scripts/devices.mjs, split by platform so the halves run
          # side by side.
          - { name: "devices · iOS", run: "DEVICES=ios node scripts/e2e-devices.mjs '' e2e-shots/devices" }
          - { name: "devices · Android", run: "DEVICES=android node scripts/e2e-devices.mjs '' e2e-shots/devices" }
          - { name: "accessibility", run: "node scripts/e2e-a11y.mjs" }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: out
      - name: Run
        run: ${{ matrix.run }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-${{ strategy.job-index }}
          path: e2e-shots
          retention-days: 7

  # Platform parity: both native shells build together, always both or neither (see "changes").
  android:
    name: Android debug build
    needs: [changes, build]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: out
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npx cap sync android
      # Gradle's build cache is keyed by task inputs, not file times, so it reuses compiled plugins and
      # resources from earlier runs even on a fresh checkout.
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'android/**/*.gradle') }}-${{ github.sha }}
          restore-keys: |
            gradle-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'android/**/*.gradle') }}-
            gradle-build-${{ runner.os }}-
      # The phone app and the Wear OS app (android/wear), plus both apps' native unit tests.
      - run: ./gradlew assembleDebug :app:testDebugUnitTest :wear:testDebugUnitTest --no-daemon --build-cache --parallel
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: liftsmith-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: liftsmith-wear-debug-apk
          path: android/wear/build/outputs/apk/debug/wear-debug.apk
          retention-days: 7

  # Doesn't wait for the web build: nobody installs this build, and the compile doesn't depend on the web
  # files, so a placeholder page stands in for out/ (the Android job keeps the real one for its APK).
  ios:
    name: iOS simulator build
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ./.github/actions/setup
      - name: Placeholder web build
        run: mkdir -p out/app && echo '<!doctype html><title>Liftsmith</title>' | tee out/index.html > out/app/index.html
      - run: npx cap sync ios
      # Swift packages download Capacitor's binaries from GitHub releases, which sometimes return 5xx.
      # Cache them, and retry resolution with backoff before building.
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/ios/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'package-lock.json') }}
      - name: Resolve Swift packages (with retries)
        run: |
          for i in 1 2 3 4; do
            xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App -derivedDataPath build/ios && exit 0
            echo "::warning::Package resolution failed (attempt $i), retrying in $((i * 15)) s"; sleep $((i * 15))
          done
          exit 1
      # A generic simulator destination builds every simulator architecture; arm64 alone (the runner's own)
      # halves the compile. No index store either, since nobody browses this build in Xcode. No -sdk: the
      # destination picks the iOS simulator, and the embedded Apple Watch app builds for the watch simulator.
      - name: Build for the simulator (unsigned)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          COMPILER_INDEX_STORE_ENABLE=NO build

  passed:
    name: CI passed
    needs: [changes, static, unit, build, browser, android, ios]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ needs.changes.result }}" != "success" ] || [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
      # Lets later runs on the same tree finish at once (see "changes"). A pull request's status goes on its head
      # commit, which is what a squash merge and the promotion pull request look up. Dependabot's token can't write
      # statuses; its merges then simply run in full.
      - name: Record the tested tree
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >
          gh api "repos/${{ github.repository }}/statuses/$SHA" -f state=success -f context="CI passed tree"
          -f description="Passed on tree ${{ needs.changes.outputs.tree }}" --silent
