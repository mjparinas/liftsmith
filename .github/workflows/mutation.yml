name: Mutation tests

# Stryker on the engine (plates, progression, recovery, blocks, generator, stats, game). Too slow for every
# pull request, so it runs weekly, on demand, and on pull requests that touch the engine. The incremental
# file is cached so a rerun only redoes what changed. Fails below the `break` score in stryker.config.mjs.

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/lib/plates.ts"
      - "src/lib/progression.ts"
      - "src/lib/recovery.ts"
      - "src/lib/block.ts"
      - "src/lib/generator.ts"
      - "src/lib/derive.ts"
      - "src/lib/game.ts"
      - "src/lib/loads.ts"

permissions:
  contents: read

jobs:
  mutation:
    name: Stryker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: reports/mutation/stryker-incremental.json
          key: stryker-${{ github.sha }}
          restore-keys: stryker-
      - run: npx stryker run
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 14
