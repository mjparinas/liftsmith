name: Promote staging

# Pull requests merge into `staging`; this job lands them on `main` once a night, so Vercel makes one production
# build a day instead of one per merge (build minutes were most of the Vercel bill). It promotes only when CI
# passed on staging's latest commit, and merges `main` back into `staging` afterwards so the two stay level.
# Run it by hand from the Actions tab (Run workflow) to ship sooner.
#
# `main` only accepts changes through a pull request, so the job opens (or reuses) a pull request from `staging` and
# merges it with a merge commit. The "CI passed" check it waited for is on the same commit, so the pull request
# already shows it green. One-time setup: Settings > Actions > General > "Allow GitHub Actions to create and approve
# pull requests" must be on. If `main` also requires a review, give the merge a token that may bypass it by adding a
# repository secret PROMOTE_TOKEN (a fine-grained token with Contents and Pull requests write on this repository).
#
# After a promotion it starts Release (store builds: Play internal testing and TestFlight). A merge made with the
# default GITHUB_TOKEN doesn't fire release.yml's `push` trigger (GitHub never chains workflows that way), so the job
# dispatches it itself. With PROMOTE_TOKEN the push does fire it, so the job leaves it alone and nothing runs twice.

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC, about 1-2 am Pacific
  workflow_dispatch:

permissions:
  actions: write # start the Release workflow after a promotion
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: promote-staging
  cancel-in-progress: false

jobs:
  promote:
    name: Merge staging into main
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/github-script@v9
        env:
          HAS_PROMOTE_TOKEN: ${{ secrets.PROMOTE_TOKEN != '' }}
        with:
          github-token: ${{ secrets.PROMOTE_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const staging = (await github.rest.repos.getBranch({ owner, repo, branch: 'staging' })).data.commit.sha;
            const cmp = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `main...${staging}` });
            const treeOf = async (ref) => (await github.rest.git.getCommit({ owner, repo, commit_sha: ref })).data.tree.sha;
            const head = (await github.rest.git.getCommit({ owner, repo, commit_sha: staging })).data;
            const mainSha = (await github.rest.repos.getBranch({ owner, repo, branch: 'main' })).data.commit.sha;
            // After a promotion, staging's head is the "Bring main back into staging" merge: one commit main lacks, but
            // the same files. Nothing to ship then (and that merge, pushed with GITHUB_TOKEN, never starts CI).
            if (cmp.data.ahead_by === 0 || head.tree.sha === (await treeOf(mainSha))) {
              core.notice('staging has nothing that main lacks.');
              return;
            }
            const ciPassed = async (sha) => {
              const checks = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: sha, per_page: 100 });
              return checks.filter((c) => c.name === 'CI passed').sort((a, b) => b.id - a.id)[0];
            };
            const ciRuns = async (sha) =>
              (await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'ci.yml', head_sha: sha, per_page: 1 })).data.total_count;
            // The CI that vouches for staging's head: its own, or, when the head is a merge pushed with GITHUB_TOKEN (which
            // never starts CI) that changed no files, the "CI passed" of the parent with the same tree.
            let ref = staging;
            if ((await ciRuns(staging)) === 0) {
              for (const p of head.parents) {
                if ((await treeOf(p.sha)) === head.tree.sha) {
                  const c = await ciPassed(p.sha);
                  if (c && c.status === 'completed' && c.conclusion === 'success') {
                    core.info(`staging's head ${staging.slice(0, 7)} has the same files as ${p.sha.slice(0, 7)}, where CI passed.`);
                    ref = p.sha;
                    break;
                  }
                }
              }
            }
            // Run by hand right after a merge, CI on staging is usually still going: wait for it (up to 25 minutes)
            // rather than fail and need a second run. A failed or missing check still stops the promotion, and when no
            // CI run exists for the commit after two minutes, none is coming, so stop then with a clear message.
            let passed = await ciPassed(ref);
            for (let waited = 0; waited < 25 * 60 && (!passed || passed.status !== 'completed'); waited += 30) {
              if (!passed && waited >= 120 && (await ciRuns(ref)) === 0) {
                core.setFailed(
                  `No CI run exists for staging's head (${staging.slice(0, 7)}, "${head.message.split('\n')[0]}"), so it can't be checked. ` +
                    'Commits pushed with GITHUB_TOKEN start no workflows: merge a pull request into staging (or push to it) to run CI, then promote again. Nothing promoted.',
                );
                return;
              }
              core.info(`Waiting for CI on staging (${ref.slice(0, 7)}): ${passed ? passed.status : 'not started yet'}.`);
              await new Promise((r) => setTimeout(r, 30_000));
              passed = await ciPassed(ref);
            }
            if (!passed || passed.status !== 'completed' || passed.conclusion !== 'success') {
              core.setFailed(`CI has not passed on staging (${staging.slice(0, 7)}): ${passed ? `${passed.status} / ${passed.conclusion}` : 'no "CI passed" check yet'}. Nothing promoted.`);
              return;
            }
            core.info(`${cmp.data.ahead_by} commit(s) ahead, CI passed on ${staging.slice(0, 7)}.`);
            // main only takes pull requests: open one from staging (or reuse the open one) and merge it with a merge commit,
            // so a change that went straight to main (a Dependabot update, a hotfix) doesn't block the night's promotion.
            const date = new Date().toISOString().slice(0, 10);
            const open = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:staging`, base: 'main' });
            const pr = open.data[0] ?? (await github.rest.pulls.create({
              owner, repo, head: 'staging', base: 'main',
              title: `Promote staging to main (${date})`,
              body: 'Opened by the nightly "Promote staging" workflow after CI passed on staging.',
            })).data;
            // A pull request opened a moment ago can answer 405 "Base branch was modified" while GitHub is still working out
            // whether it can merge (2026-11-17: the merge came two seconds after the open and failed). Try again a few times.
            let merged;
            for (let attempt = 1; ; attempt++) {
              try {
                merged = await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'merge', sha: staging, commit_title: `Promote staging to main (${date})` });
                break;
              } catch (e) {
                if (e.status !== 405 || attempt >= 6) throw e;
                core.info(`Merge not ready yet (${e.message}); trying again in 10 s.`);
                await new Promise((r) => setTimeout(r, 10000));
              }
            }
            core.notice(`Merged pull request #${pr.number}; main is now ${merged.data.sha.slice(0, 7)}.`);
            if (process.env.HAS_PROMOTE_TOKEN !== 'true') {
              // workflow_dispatch is the one way a GITHUB_TOKEN may start another workflow.
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'release.yml', ref: 'main' });
              core.notice('Started Release (Play internal testing and TestFlight) on main.');
            }
            try {
              await github.rest.repos.merge({ owner, repo, base: 'staging', head: 'main', commit_message: 'Bring main back into staging' });
            } catch (e) {
              core.warning(`Could not merge main back into staging: ${e.message}`);
            }
