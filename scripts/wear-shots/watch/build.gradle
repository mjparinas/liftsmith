// Paparazzi rig for the Wear OS email pictures (see src/test/kotlin/WatchShots.kt). It borrows the watch app's res folder.
plugins { id 'com.android.library'; id 'org.jetbrains.kotlin.android'; id 'app.cash.paparazzi' }
android {
  namespace 'com.getliftsmith.app.wear'
  compileSdk 34
  defaultConfig { minSdk 30 }
  sourceSets { main { res.srcDirs = ['../../../android/wear/src/main/res'] } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
