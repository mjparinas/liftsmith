apply plugin: 'com.android.application'

android {
    namespace = "com.getliftsmith.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.getliftsmith.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI sets these from the run number and package.json (see .github/workflows/release.yml).
        versionCode((System.getenv("VERSION_CODE") ?: "1") as int)
        versionName(System.getenv("VERSION_NAME") ?: "0.1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // The upload key comes from CI secrets; local release builds without it stay unsigned.
    signingConfigs {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "upload"
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // NotificationCompat with Android 16 Live Updates (setRequestPromotedOngoing, setShortCriticalText) for WorkoutService.
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation project(':capacitor-android')
    // Play Install Referrer: which tagged Play link brought an install in (InstallInfoPlugin).
    implementation "com.android.installreferrer:installreferrer:2.2"
    // Sign in with Google for accounts (AccountSignInPlugin): Credential Manager and Google's ID token option.
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    // The Wear OS app (android/wear): the workout goes to the watch and its taps and heart rate come back (WatchLink).
    implementation "com.google.android.gms:play-services-wearable:$playServicesWearableVersion"
    // Opens the watch app when a workout starts on the phone (WatchLink.openOnWatch).
    implementation "androidx.wear:wear-remote-interactions:$wearRemoteInteractionsVersion"
    // RemoteActivityHelper returns a ListenableFuture; Guava is already in the app through Health Connect.
    implementation "com.google.guava:guava:32.0.0-jre"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
